auth:
  whitelist:
    - /user/code
    - /user/login
    # shop 公开读接口（写接口 POST/PUT /shop 仍须登录）
    - /shop/*
    - /shop/of/type
    - /shop/of/name
    - /shop-type/list
    # voucher 公开读接口（秒杀下单 POST /voucher-order、新增券 POST /voucher 仍须登录）
    - /voucher/list/*
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/shop/**,/shop-type/**
        - id: voucher-service
          uri: lb://voucher-service
          predicates:
            - Path=/voucher/**,/voucher-order/**
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/blog/**,/follow/**
